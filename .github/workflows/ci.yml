name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: retail
          POSTGRES_PASSWORD: retail
          POSTGRES_DB: retail_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retail" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RETAIL_TEST_PG_URL: postgresql://retail:retail@localhost:5432/retail_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt -r requirements-analytics.txt
      - name: Generate a small dataset
        run: python generator/generate_data.py --stores 8 --days 14
      - name: Run the pipeline twice (second run must load nothing)
        run: |
          python -m etl init-db
          python -m etl run --quiet
          python -m etl run --quiet | tee second_run.txt
          grep -q '"files_new": 0' second_run.txt
      - name: dbt build (models + data tests)
        run: dbt build --project-dir analytics --profiles-dir analytics
      - name: Unit, end-to-end, PostgreSQL and dashboard tests
        run: python -m pytest -v --cov=etl --cov-report=term-missing
